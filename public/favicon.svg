<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <!-- Squircle tile: carries its own background so the mark stays legible
       against light and dark browser chrome alike. -->
  <rect width="64" height="64" rx="15" fill="url(#g)" />

  <!-- Geometric "E". The stem is what keeps it from reading as a
       hamburger icon once it shrinks to 16px. -->
  <g fill="#ffffff">
    <rect x="19" y="18" width="7.5" height="28" rx="3.75" />
    <rect x="19" y="18" width="26" height="7.5" rx="3.75" />
    <rect x="19" y="28.25" width="18" height="7.5" rx="3.75" />
    <rect x="19" y="38.5" width="26" height="7.5" rx="3.75" />
  </g>
</svg>
